name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Recent pieces are gated behind a "click here to continue reading" link for
  # a year, then revert to showing in full (src/lib/gating.ts) — but that only
  # takes effect on a rebuild, and this site otherwise only rebuilds on push.
  # This weekly rebuild is what actually lifts the gate on schedule.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Astro
        run: npm run build
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Astro puts the built files here dynamically

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
